<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body{margin:0;background:#EDECE8;font-family:'Plus Jakarta Sans',sans-serif;color:#1D1D1B;-webkit-font-smoothing:antialiased}a{color:#1D1D1B}a:hover{color:#5F5E5A}*{box-sizing:border-box}</style>
</helmet>
<section style="padding:96px;display:flex;flex-direction:column;gap:56px;font-family:'Plus Jakarta Sans',sans-serif">
<div style="display:flex;flex-direction:column;gap:14px">
<div style="display:flex;gap:10px;align-items:center"><span style="font-family:'Geist Mono',monospace;font-size:18px;background:#1D1D1B;color:#fff;padding:6px 14px;border-radius:999px">v2</span><span style="font-size:20px;font-weight:600;color:#5F5E5A">Tetra Booth · Bagian D</span></div>
<div style="font-size:76px;font-weight:800;letter-spacing:-.035em">Live Slideshow</div>
<div style="font-size:24px;color:#5F5E5A">TV/proyektor 1920×1080, tanpa interaksi. Strip baru muncul realtime.</div>
</div>
<div id="D1" style="display:flex;flex-direction:column;gap:20px">
<div style="display:flex;align-items:center;gap:14px"><span style="background:#1D1D1B;color:#fff;font-weight:700;font-size:20px;padding:6px 14px;border-radius:10px">D1</span><span style="font-size:24px;font-weight:600;color:#3A3936">Live Slideshow</span></div>
<div data-screen-label="D1 Slideshow" style="flex:none;width:1920px;height:1080px;background:#F8F7F4;position:relative;overflow:hidden;border:2.5px solid #1D1D1B;border-radius:28px;display:grid;grid-template-columns:1fr 480px">
<div style="position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden">
<div style="position:absolute;left:-200px;bottom:-240px;width:760px;height:760px;border-radius:50%;background:#D6F1EA"></div>
<div style="position:absolute;left:-100px;bottom:-140px;width:560px;height:560px;border-radius:50%;border:2px solid #fff"></div>
<div style="position:absolute;right:120px;top:-140px;width:360px;height:360px;border-radius:50%;background:#FCE3C6"></div>
<div style="position:absolute;top:64px;left:80px;display:flex;flex-direction:column;gap:16px"><span style="align-self:flex-start;font-size:22px;font-weight:700;border:2.5px solid #1D1D1B;border-radius:999px;padding:8px 20px;background:#CEC8F6;white-space:nowrap">The Wedding of</span><div style="font-size:84px;font-weight:800;letter-spacing:-.05em;line-height:.95">Andi &amp;<br>Sari</div></div>
<div style="position:relative;width:540px;height:810px;background:#fff;border:3px solid #1D1D1B;border-radius:12px;box-shadow:16px 16px 0 -3px #fff,16px 16px 0 0 #1D1D1B;padding:26px 26px 0;display:flex;flex-direction:column;margin-left:260px">
<div style="position:absolute;top:-30px;right:-40px;background:#F8D98B;border:3px solid #1D1D1B;font-size:32px;font-weight:800;padding:12px 28px;border-radius:999px;transform:rotate(6deg);white-space:nowrap">Baru!</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;flex:1">
<div style="border-radius:6px;background:repeating-linear-gradient(135deg,#EFEDE8 0 12px,#E6E3DD 12px 24px)"></div><div style="border-radius:6px;background:repeating-linear-gradient(135deg,#EFEDE8 0 12px,#E6E3DD 12px 24px)"></div><div style="border-radius:6px;background:repeating-linear-gradient(135deg,#EFEDE8 0 12px,#E6E3DD 12px 24px)"></div><div style="border-radius:6px;background:repeating-linear-gradient(135deg,#EFEDE8 0 12px,#E6E3DD 12px 24px)"></div>
</div>
<div style="height:124px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px"><span style="font-size:32px;font-weight:800;letter-spacing:-.03em">Andi &amp; Sari</span><span style="font-family:'Geist Mono',monospace;font-size:16px;color:#5F5E5A">12.10.2026</span></div>
</div>
</div>
<div style="background:#fff;border-left:2.5px solid #1D1D1B;padding:52px 44px;display:flex;flex-direction:column;gap:24px">
<div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:26px;font-weight:800;letter-spacing:-.02em">Terbaru</span><span style="display:flex;align-items:center;gap:8px;font-size:18px;font-weight:700"><span style="width:12px;height:12px;border-radius:50%;background:#5DB978;border:1.5px solid #1D1D1B"></span>Live</span></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:22px">
<sc-for list="{{ queue }}" as="q" hint-placeholder-count="4"><div style="aspect-ratio:2/3;background:#fff;border:2px solid #1D1D1B;border-radius:8px;box-shadow:6px 6px 0 -2px {{ q.bg }},6px 6px 0 0 #1D1D1B;padding:8px"><div style="width:100%;height:84%;border-radius:4px;background:repeating-linear-gradient(135deg,#EFEDE8 0 8px,#E6E3DD 8px 16px)"></div></div></sc-for>
</div>
<div style="margin-top:auto;background:#D6EEF8;border:2.5px solid #1D1D1B;border-radius:24px;padding:22px;display:flex;align-items:center;gap:22px">
<div style="background:#fff;border:2px solid #1D1D1B;border-radius:14px;padding:8px;flex:none"><img src="{{ qr }}" style="width:130px;height:130px;display:block"></div>
<div style="font-size:26px;font-weight:800;line-height:1.2;letter-spacing:-.02em">Scan untuk lihat semua foto</div>
</div>
</div>
</div>
</div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  qr(seed, color) {
    let s = seed; const r = () => (s = (s * 9301 + 49297) % 233280) / 233280;
    const n = 29; let d = '';
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
      const f = (x < 8 && y < 8) || (x > n - 9 && y < 8) || (x < 8 && y > n - 9);
      if (!f && r() < 0.5) d += `M${x} ${y}h1v1h-1z`;
    }
    const fd = (x, y) => `<rect x="${x}" y="${y}" width="7" height="7" rx="1.5" fill="${color}"/><rect x="${x+1}" y="${y+1}" width="5" height="5" rx="1" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3" rx=".6" fill="${color}"/>`;
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges"><rect width="${n}" height="${n}" fill="#fff"/><path d="${d}" fill="${color}"/>${fd(0,0)}${fd(n-7,0)}${fd(0,n-7)}</svg>`;
    return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
  }
  renderVals() { return { qr: this.qr(99, '#1D1D1B'), queue: ['#FCE3C6', '#D6EEF8', '#CEC8F6', '#D6F1EA'].map(bg => ({ bg })) }; }
}
</script>
</body>
</html>
